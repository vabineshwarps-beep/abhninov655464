body{background:#f7f3ec}.admin{max-width:1050px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-weight:600;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;font:inherit}.btn{cursor:pointer;border:0;padding:10px 14px;border-radius:8px;background:#6b1d7a;color:#fff;text-decoration:none}.btn.secondary{background:#eee;color:#333}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.stat{background:#f4edf6;border-radius:12px;padding:12px 16px}.stat strong{display:block;font-size:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;vertical-align:top}th{background:#faf7fb}.hidden{display:none !important}.msg{margin-top:12px}.error{color:#b42318}.ok{color:#16794c}.muted{color:#666;font-size:13px}.wa-btn{display:inline-block;margin-left:6px;padding:2px 8px;font-size:11px;line-height:1.4;border-radius:6px;background:#25D366;color:#fff;text-decoration:none;font-weight:600;vertical-align:middle;white-space:nowrap}.wa-btn:hover{background:#1da851;color:#fff}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.admin{margin:15px auto;padding:10px}.card{padding:16px}}

<body><main class="admin">
<div class="card"><div class="top"><div><h1>Customer Enquiries</h1><p>Customer enquiry records. Protected by Supabase Auth + database RLS.</p></div><div><a href="admin.html" class="btn secondary">← Site Rate</a> <button id="logout" class="btn" type="button">Logout</button></div></div></div>
<section id="loginCard" class="card"><h2>Admin Login</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" type="button" style="margin-top:12px">Login</button><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden">
<div class="card"><div class="toolbar"><div class="field"><label>View date (optional)</label><input id="dateFilter" type="date"></div><div class="field"><label>Search name / mobile / address / loan number</label><input id="search" type="search" placeholder="Search customer..."></div><button id="refresh" class="btn" type="button">Refresh</button></div><div class="summary"><div class="stat"><span>Selected date</span><strong id="dayCount">0</strong></div><div class="stat"><span>Total enquiries</span><strong id="totalCount">0</strong></div></div><p id="msg" class="msg"></p></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Serial No.</th><th>Date & time</th><th>Name</th><th>Mobile</th><th>Address</th><th>Existing customer</th><th>Loan number</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody></table></div></div>
</section></main>
